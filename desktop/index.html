<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:" />
  <title>Kickoff</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 主视图 -->
  <div id="view-main" class="view">
    <header class="topbar" id="drag-region">
      <div class="brand">
        <svg class="logo" width="18" height="18" viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="8" r="7.4" fill="#6366F1"/>
          <path d="M6.4 4.9v6.2L11.2 8z" fill="#FFFFFF"/>
        </svg>
        <span class="brand-name">Kickoff</span>
      </div>
      <div class="topbar-right">
        <button id="btn-settings" class="icon-btn" title="设置服务器地址">⚙</button>
      </div>
    </header>

    <div class="weekbar" id="weekbar" hidden>
      <span class="week-label">本周</span>
      <div class="week-track"><div class="week-fill" id="week-fill"></div></div>
      <span class="week-num" id="week-num">0/0</span>
    </div>
    <div class="week-focus" id="week-focus" hidden></div>

    <main class="card-area" id="card-area"><!-- 状态区由 renderer.js 渲染 --></main>

    <footer class="footer">
      <div class="park-hint">
        <span class="park-badge">P</span>
        <span>杂念冒出来了?随手停车 <kbd>Shift+Cmd+K</kbd></span>
      </div>
      <button id="btn-web" class="link-btn">打开 Web 应用 ↗</button>
    </footer>
  </div>

  <!-- 设置视图 -->
  <div id="view-settings" class="view" hidden>
    <header class="topbar">
      <button id="btn-back" class="icon-btn" title="返回">‹</button>
      <span class="topbar-title">服务器设置</span>
    </header>
    <main class="settings-body">
      <label class="settings-label" for="input-server">Kickoff Web 地址</label>
      <input id="input-server" type="url" placeholder="http://localhost:3000" spellcheck="false" />
      <p class="settings-tip">桌面端从这里读取今日计划、打卡并写入停车场。</p>
      <div class="settings-actions">
        <button id="btn-save-server" class="btn btn-primary">保存</button>
        <button id="btn-test-server" class="btn btn-ghost">测试连接</button>
      </div>
      <p id="settings-msg" class="settings-msg" role="status"></p>
    </main>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
